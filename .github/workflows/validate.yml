# The authoritative validator: `gpty plugin validate` runs the same
# `parse_manifest` the install path runs, installed from a pinned commit —
# a tag is mutable, the SHA is the pin. The one check the validator cannot
# make stays here: the install gate requires `id` to equal the install
# target (`owner/repo`), and only this repo knows which target it is.
name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-validate-2f17459

      - name: Install the gpty CLI at the pinned revision
        run: cargo install --git https://github.com/godot-pty/gpty --rev 2f174598561540d2b0c6836c57d81182e99bfa61 --locked gpty

      - name: Validate the manifest
        run: |
          gpty version
          gpty plugin validate .

      - name: The manifest must declare this repo's id
        run: |
          python3 - <<'EOF'
          import tomllib
          with open("gpty-plugin.toml", "rb") as f:
              m = tomllib.load(f)
          assert m.get("id") == "godot-pty/gpty-lazygit", f"manifest id must be godot-pty/gpty-lazygit, got {m.get('id')!r}"
          EOF
